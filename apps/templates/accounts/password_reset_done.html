{% load static %}<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırlama Gönderildi · Koç Gayrimenkul Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="{% static 'assets/img/brand/favicon.png' %}" type="image/png">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f5f5f5; }
    .auth-card { max-width: 420px; margin: 80px auto; }
    .koc-header { background: linear-gradient(135deg, #7a1a29 0%, #9d2235 100%); border-radius: 12px 12px 0 0; padding: 32px; text-align: center; }
    .koc-card-body { background: #fff; border-radius: 0 0 12px 12px; padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
    .success-icon { font-size: 3rem; color: #28a745; margin-bottom: 16px; }
    .btn-koc { background: #9d2235; border-color: #9d2235; color: #fff; display: block; text-align: center; padding: 12px; border-radius: 8px; font-weight: 600; text-decoration: none; }
    .btn-koc:hover { background: #7a1a29; color: #fff; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="koc-header">
      <h3 class="text-white mb-0" style="font-size:1.3rem;font-weight:700;">Şifre Sıfırlama</h3>
    </div>
    <div class="koc-card-body text-center">
      <div class="success-icon"><i class="fas fa-check-circle"></i></div>
      <h4 style="font-weight:700;color:#333;">E-posta Gönderildi!</h4>
      <p class="text-muted mb-4">
        Şifre sıfırlama bağlantısı e-posta adresinize gönderildi. Lütfen gelen kutunuzu (ve spam klasörünüzü) kontrol edin.
      </p>
      <a href="{% url 'login' %}" class="btn-koc">
        <i class="fas fa-arrow-left mr-2"></i> Giriş Sayfasına Dön
      </a>
    </div>
  </div>
</body>
</html>
