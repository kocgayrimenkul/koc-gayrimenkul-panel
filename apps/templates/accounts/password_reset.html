{% load static %}<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırlama · Koç Gayrimenkul Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'assets/css/argon.css' %}?v=1.3.0" type="text/css">
  <link rel="icon" href="{% static 'assets/img/brand/favicon.png' %}" type="image/png">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f5f5f5; }
    .auth-card { max-width: 420px; margin: 80px auto; }
    .koc-header { background: linear-gradient(135deg, #7a1a29 0%, #9d2235 100%); border-radius: 12px 12px 0 0; padding: 32px; text-align: center; }
    .koc-card-body { background: #fff; border-radius: 0 0 12px 12px; padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
    .btn-koc { background: #9d2235; border-color: #9d2235; color: #fff; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; }
    .btn-koc:hover { background: #7a1a29; }
    .form-control { border-radius: 8px; padding: 10px 14px; border: 1.5px solid #e0e0e0; }
    .form-control:focus { border-color: #9d2235; box-shadow: 0 0 0 3px rgba(157,34,53,.15); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="koc-header">
      <img src="{% static 'assets/img/brand/koc-logo.png' %}" alt="Koç Gayrimenkul" height="48" onerror="this.style.display='none'">
      <h3 class="text-white mt-2 mb-1" style="font-size:1.3rem;font-weight:700;">Şifre Sıfırlama</h3>
      <p class="text-white-50 mb-0 small">E-posta adresinize sıfırlama bağlantısı gönderilecek</p>
    </div>
    <div class="koc-card-body">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} mb-3">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group mb-3">
          <label class="form-control-label" style="font-weight:600;color:#333;">E-posta Adresi</label>
          <input type="email" name="email" class="form-control" placeholder="ornek@kocgayrimenkul.com" required autofocus>
        </div>
        <button type="submit" class="btn btn-koc mt-2">
          <i class="fas fa-paper-plane mr-2"></i> Sıfırlama Bağlantısı Gönder
        </button>
      </form>
      <hr class="my-3">
      <div class="text-center">
        <a href="{% url 'login' %}" class="text-muted small">
          <i class="fas fa-arrow-left mr-1"></i> Giriş sayfasına dön
        </a>
      </div>
    </div>
  </div>
</body>
</html>
