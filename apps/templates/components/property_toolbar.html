<!-- Gayrimenkul Sayfası Araç Çubuğu Komponenti -->
<div class="card shadow-sm mb-4">
  <div class="card-body d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
      <h3 class="mb-0 mr-3">{{ list_title|default:"Gayrimenkuller" }}</h3>
      <span class="badge badge-pill badge-koc-red">{{ properties|length }} Kayıt</span>
    </div>
    <div class="d-flex align-items-center">
      {% if show_search|default:True %}
      <div class="input-group input-group-sm mr-3" style="width: 250px;">
        <input type="text" class="form-control" placeholder="{{ search_placeholder|default:'İlan başlığında ara...' }}">
        <div class="input-group-append">
          <button class="btn btn-outline-koc-red" type="button">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>
      {% endif %}
      {% if show_view_toggle|default:True %}
      <div class="btn-group view-toggle" role="group">
        <button type="button" class="btn btn-outline-koc-red active" id="tableViewBtn" data-toggle="tooltip" title="Tablo Görünümü">
          <i class="fas fa-list"></i>
        </button>
        <button type="button" class="btn btn-outline-koc-red" id="cardViewBtn" data-toggle="tooltip" title="Kart Görünümü">
          <i class="fas fa-th-large"></i>
        </button>
      </div>
      {% endif %}
    </div>
  </div>
</div>
