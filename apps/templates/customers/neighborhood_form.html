{% extends "layouts/base.html" %}

{% block title %} {% if neighborhood %}Mahalle Düzenle{% else %}Yeni Mahalle{% endif %} {% endblock %}

{% block content %}
<div class="header bg-gradient-primary pb-8 pt-5 pt-md-8">
  <div class="container-fluid">
    <div class="header-body">
      <div class="row">
        <div class="col">
          <h1 class="text-white mb-0">
            {% if neighborhood %}Mahalle Düzenle{% else %}Yeni Mahalle Ekle{% endif %}
          </h1>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid mt--7">
  <div class="row">
    <div class="col-xl-8 order-xl-1">
      <div class="card bg-secondary shadow">
        <div class="card-header bg-white border-0">
          <div class="row align-items-center">
            <div class="col-8">
              <h3 class="mb-0">Mahalle Bilgileri</h3>
            </div>
            <div class="col-4 text-right">
              <a href="{% url 'neighborhood_list' %}" class="btn btn-sm btn-secondary">
                <i class="fas fa-arrow-left"></i> Geri
              </a>
            </div>
          </div>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            
            <div class="pl-lg-4">
              <div class="row">
                <div class="col-lg-12">
                  <div class="form-group">
                    <label class="form-control-label" for="name">Mahalle Adı *</label>
                    <input type="text" 
                           id="name" 
                           name="name" 
                           class="form-control form-control-alternative" 
                           placeholder="Mahalle adı" 
                           value="{% if neighborhood %}{{ neighborhood.name }}{% endif %}"
                           required>
                  </div>
                </div>
              </div>
              
              <div class="row">
                <div class="col-lg-12">
                  <div class="form-group">
                    <label class="form-control-label" for="district">İlçe</label>
                    <input type="text" 
                           id="district" 
                           name="district" 
                           class="form-control form-control-alternative" 
                           placeholder="İlçe adı" 
                           value="{% if neighborhood %}{{ neighborhood.district }}{% endif %}">
                  </div>
                </div>
              </div>
              
              <div class="row">
                <div class="col-lg-12">
                  <div class="form-group">
                    <label class="form-control-label" for="consultant">Bağlı Danışman</label>
                    <select id="consultant" 
                            name="consultant" 
                            class="form-control form-control-alternative">
                      <option value="">Danışman Seçin (Opsiyonel)</option>
                      {% for c in consultants %}
                      <option value="{{ c.id }}" {% if neighborhood and neighborhood.consultant.id == c.id %}selected{% endif %}>
                        {{ c.get_full_name }}
                      </option>
                      {% endfor %}
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <hr class="my-4">
            
            <div class="pl-lg-4">
              <div class="row">
                <div class="col-lg-12">
                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Kaydet
                  </button>
                  <a href="{% url 'neighborhood_list' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> İptal
                  </a>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
